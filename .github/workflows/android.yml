name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build Android APK via Flet CLI
        run: |
          # main.py သို့မဟုတ် ဆတန_3.py ဖိုင်အား APK တည်ဆောက်ပါသည်
          if [ -f "ဆတန_3.py" ]; then
            flet build apk --main ဆတန_3.py --icon assets/app_icon.png
          elif [ -f "main.py" ]; then
            flet build apk --main main.py --icon assets/app_icon.png
          else
            flet build apk --icon assets/app_icon.png
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Machine-Management-APK
          path: build/apk/*.apk
