name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ၁။ Project Source Code ကို Checkout လုပ်ခြင်း
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ၂။ Android Build ပြုလုပ်ရန် Java (JDK 17) ပြင်ဆင်ခြင်း
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ၃။ Flutter SDK ကို ကြိုတင် ပြင်ဆင်ပေးခြင်း (Interactive Prompt မတောင်းစေရန်)
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ၄။ Python Environment ပြင်ဆင်ခြင်း
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ၅။ လိုအပ်သော Python Dependencies များ တပ်ဆင်ခြင်း
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flet flet-cli

      # ၆။ Flet APK Build ပြုလုပ်ခြင်း (--yes Flag ဖြင့် EOFError ကို ဖြေရှင်းထားသည်)
      - name: Build Android APK
        run: |
          flet build apk --yes

      # ၇။ ထွက်ရှိလာသော APK ဖိုင်ကို GitHub Artifacts အနေဖြင့် ရယူနိုင်ရန် သိမ်းဆည်းခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-android-app
          path: build/apk/*.apk
